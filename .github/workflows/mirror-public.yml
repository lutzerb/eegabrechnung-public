name: Mirror to Public Repo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    environment: HETZNER_API_KEY
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          path: private
          fetch-depth: 0

      - name: Sync as a new release commit on the public repo
        env:
          DEPLOY_KEY_B64: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
          HETZNER_API_KEY: ${{ secrets.HETZNER_API_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          git clone git@github.com:lutzerb/eegabrechnung-public.git public
          cd public
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          PRIVATE_HEAD=$(git -C ../private rev-parse HEAD)
          LAST_SHA=""
          if [ -f .mirror-state ]; then
            LAST_SHA=$(cat .mirror-state)
          fi

          if [ -n "$LAST_SHA" ] && git -C ../private cat-file -e "$LAST_SHA" 2>/dev/null; then
            LOG=$(git -C ../private log --no-merges --pretty='format:- %s' "$LAST_SHA..$PRIVATE_HEAD")
          else
            LOG=$(git -C ../private log --no-merges --pretty='format:- %s' -20)
          fi

          rsync -a --delete --exclude '.git' --exclude '.mirror-state' ../private/ ./
          echo "$PRIVATE_HEAD" > .mirror-state

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi

          SUMMARY=""
          if [ -n "$HETZNER_API_KEY" ]; then
            SYSTEM_PROMPT='Du fasst eine Reihe interner Git-Commit-Messages zu kurzen, öffentlich lesbaren Release-Notes für ein Open-Source-Spiegel-Repository zusammen.
          Regeln:
          - Antworte auf Deutsch.
          - Gib 3-8 Stichpunkte aus, jeweils eine knappe Zeile beginnend mit "- ".
          - Fasse zusammengehörige Commits sinnvoll in einem Stichpunkt zusammen; überspringe rein interne Chores (CI-Anpassungen, Formatierung, Kommentar-Fixes, Dependency-Updates), außer es gibt sonst nichts anderes.
          - Nenne niemals Kundennamen, Organisationsnamen, interne Hostnamen/IPs/Ports, Zugangsdaten, Tokens, API-Keys, Ticket-/ID-Nummern oder andere Details, die einen bestimmten Kunden identifizieren oder Geheimnisse offenlegen könnten. Verallgemeinere stattdessen (z.B. "verbesserte Mandantentrennung" statt des konkreten Organisationsnamens).
          - Falls nichts davon öffentlich relevant ist, gib exakt aus: "- Interne Wartung und Refactoring."
          - Gib ausschließlich die Stichpunktliste aus, keine Überschriften, keine Kommentare, keine Markdown-Formatierung außer dem führenden "- ".'

            REQUEST_BODY=$(jq -n \
              --arg system "$SYSTEM_PROMPT" \
              --arg log "$LOG" \
              '{
                model: "Qwen/Qwen3.6-35B-A3B-FP8",
                max_tokens: 1024,
                chat_template_kwargs: {enable_thinking: false},
                messages: [
                  {role: "system", content: $system},
                  {role: "user", content: $log}
                ]
              }')

            RESPONSE=$(curl -sS https://inference.hetzner.com/api/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $HETZNER_API_KEY" \
              -d "$REQUEST_BODY") || true

            SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty' 2>/dev/null)
          fi

          if [ -z "$SUMMARY" ]; then
            echo "LLM summary unavailable, falling back to raw commit subjects"
            SUMMARY="$LOG"
          fi

          {
            echo "Release $(date +'%Y-%m-%d')"
            echo
            echo "$SUMMARY"
          } > /tmp/commit-msg.txt

          git commit -F /tmp/commit-msg.txt
          git push origin HEAD:main

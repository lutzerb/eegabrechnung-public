name: Mirror to Public Repo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm'
        required: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'publish'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          path: private

      - name: Sync as a new release commit on the public repo
        env:
          DEPLOY_KEY_B64: ${{ secrets.PUBLIC_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          git clone git@github.com:lutzerb/eegabrechnung-public.git public
          cd public
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          rsync -a --delete --exclude '.git' ../private/ ./

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Release $(date +'%Y-%m-%d')"
          git push origin HEAD:main
